name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --bin vapx
      - name: Broken-pipe regression test
        run: cargo test --test sigpipe
      - name: MCP server tests
        run: cargo test --test mcp
      - name: Reboot regression test
        run: cargo test --test reboot
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy -- -D warnings

  # Windows and macOS are only built at release time, so check on every PR that
  # they still compile — Unix-only code would otherwise surface at tag time.
  build-other-os:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck install.sh
        run: shellcheck install.sh

  build-matrix:
    needs: [secrets-scan, test, build-other-os, install-script]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vapx-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/vapx${{ contains(matrix.target, 'windows') && '.exe' || '' }}

  tagged-release:
    needs: build-matrix
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release files
        run: |
          mkdir -p release
          for dir in artifacts/vapx-*; do
            target=$(basename "$dir" | sed 's/vapx-//')
            if [ -f "$dir/vapx.exe" ]; then
              cp "$dir/vapx.exe" "release/vapx-${target}.exe"
            else
              cp "$dir/vapx" "release/vapx-${target}"
              chmod +x "release/vapx-${target}"
            fi
          done
          cp install.sh install.ps1 release/
          (cd release && sha256sum vapx-* install.sh install.ps1 > SHA256SUMS)
          cat release/SHA256SUMS

      - name: Create tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            | File | Platform |
            |------|----------|
            | vapx-x86_64-unknown-linux-musl | Linux x86_64 (static) |
            | vapx-aarch64-unknown-linux-musl | Linux ARM64 / Raspberry Pi 4-5 |
            | vapx-armv7-unknown-linux-musleabihf | Linux ARMv7 / Raspberry Pi 3 |
            | vapx-aarch64-apple-darwin | macOS Apple Silicon |
            | vapx-x86_64-apple-darwin | macOS Intel |
            | vapx-x86_64-pc-windows-msvc.exe | Windows x64 (also runs on ARM64) |
            | SHA256SUMS | Checksums for all of the above |

            Install or update (Linux/macOS): `curl -fsSL https://vapx.29a.se/install | sh`
            Windows (PowerShell): `irm https://vapx.29a.se/install.ps1 | iex`

  homebrew:
    needs: tagged-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch SHA256SUMS from the release
        run: |
          curl -fsSL -o SHA256SUMS \
            "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SHA256SUMS"
      - name: Update Hex29A/homebrew-tap
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:Hex29A/homebrew-tap.git tap
          mkdir -p tap/Formula
          scripts/homebrew-formula.sh "$version" SHA256SUMS > tap/Formula/vapx.rb
          cd tap
          git config user.name "vapx CI"
          git config user.email "actions@github.com"
          git add Formula/vapx.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "vapx $version"
          git push

  # The container from the README: build it and ask it for its tools.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vapx-mcp .
      - name: Run it and call tools/list
        env:
          VAPX_MCP_TOKEN: ci-token
        run: |
          mkdir conf exports
          printf 'cameras:\n  front:\n    host: 192.0.2.10\n    user: root\n    pass: pass\n' > conf/cameras.yaml
          docker run -d --name vapx-mcp --user "$(id -u):$(id -g)" -p 127.0.0.1:8080:8080 \
            -v "$PWD/conf:/config:ro" -v "$PWD/exports:/exports" -e VAPX_MCP_TOKEN vapx-mcp
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/mcp || true)
            [ "$code" = "401" ] && break
            sleep 1
          done
          test "$code" = "401"   # without the token
          body='{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
          auth_header="Authorization: Bearer ${VAPX_MCP_TOKEN}"
          curl -sf -X POST http://127.0.0.1:8080/mcp -H "$auth_header" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d "$body" | grep -q '"list_cameras"'
