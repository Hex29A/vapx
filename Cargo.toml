[package]
name = "vapx"
version = "0.28.2"
edition = "2021"
description = "Axis camera management CLI via VAPIX"
license = "MIT"
repository = "https://github.com/Hex29A/vapx"
readme = "README.md"
keywords = ["axis", "vapix", "camera", "cli", "surveillance"]
categories = ["command-line-utilities", "network-programming"]
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE"]

[[bin]]
name = "vapx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
roxmltree = "0.20"
rpassword = "7"
digest_auth = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
rayon = "1"
dirs = "6"
clap_complete = "4"
clap_mangen = "0.2"
tungstenite = "0.26"
url = "2"
keyring = { version = "3", optional = true }
rand = "0.8"
rmcp = { version = "3.6", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
base64 = "0.22"
subtle = "2"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
keyring = ["dep:keyring"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
